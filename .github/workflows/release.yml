name: Release WCode

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.18.2). Defaults to v<package.json version>."
        required: false
        type: string
      publish_docker:
        description: "Build and push multi-arch Docker image to GHCR"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release-tarball:
    name: Build & Publish GitHub Release Tarball
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${PKG_VERSION}"
          fi
          VERSION="${TAG#v}"
          IS_PRE="false"
          case "$VERSION" in
            *-*) IS_PRE="true" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & build workspace packages
        env:
          HUSKY: "0"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:bootstrap

      - name: Build flat GitHub Release distribution bundle
        shell: bash
        run: |
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            DIST_BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/"
          else
            DIST_BASE_URL="https://github.com/${{ github.repository }}/releases/latest/download/"
          fi
          pnpm run build:wcode -- \
            --flat \
            --version "${{ steps.meta.outputs.version }}" \
            --base-url "${DIST_BASE_URL}"

      - name: Run distribution regression tests
        run: node --test scripts/wcode-distribution.test.mjs

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          ASSETS=(
            "dist/wcode/wcode-${VERSION}.tar.gz"
            "dist/wcode/sha256.txt"
            "dist/wcode/latest.json"
            "dist/wcode/install.sh"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            EXTRA_ARGS=()
            if [ "$IS_PRE" = "true" ]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "WCode ${TAG}" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi

  docker-image:
    name: Build & Push Multi-Arch Docker Image (GHCR)
    needs: release-tarball
    if: ${{ github.event_name == 'push' || inputs.publish_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: docker_meta
        shell: bash
        run: |
          REPO_LOWER="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LOWER}"
          VERSION="${{ needs.release-tarball.outputs.version }}"
          TAGS="${IMAGE}:${VERSION},${IMAGE}:v${VERSION}"
          if [ "${{ needs.release-tarball.outputs.is_prerelease }}" != "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            WCODE_DIST_BASE_URL=https://github.com/${{ github.repository }}/releases/latest/download/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.release-tarball.outputs.version }}
