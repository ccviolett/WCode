# WCode Nginx 反向代理参考配置（支持 WebSocket 与 HTTPS Cookie 自动附带 Secure）
# 生产环境请补充 ssl_certificate / ssl_certificate_key（如 certbot 签发）并将 server_name 替换为实际域名。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name wcode.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wcode.example.com;

    # ssl_certificate     /etc/letsencrypt/live/wcode.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wcode.example.com/privkey.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（/ws）与长流式响应支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
