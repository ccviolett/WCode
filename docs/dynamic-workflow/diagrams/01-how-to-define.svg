  <line x1="728" y1="604" x2="739" y2="604" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Bottom Right: Unified 4-Step Plain-Chinese Annotation Card (x=742..1148, y=342..637) -->
  <rect x="742" y="342" width="406" height="295" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>

  <!-- Step 1 annotation -->
  <text x="756" y="367" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1E40AF">第 1 步 · 先看现场与跑安检门</text>
  <text x="756" y="389" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">先查 git 改动、files 搜索，或用 world.run 跑真实编译/单测摸底</text>

  <line x1="756" y1="401" x2="1134" y2="401" stroke="#DBEAFE" stroke-width="1.5"/>

  <!-- Step 2 annotation -->
  <text x="756" y="421" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1E40AF">第 2 步 · 多人分头干 + 必填验收表</text>
  <text x="756" y="443" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">agent() 建独立房间子员工不串记忆；Promise.all 多人同时干；</text>
  <text x="756" y="465" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">.ask&lt;ReviewResult&gt;() 交必填 JSON，填错自动打回重填</text>

  <line x1="756" y1="477" x2="1134" y2="477" stroke="#DBEAFE" stroke-width="1.5"/>

  <!-- Step 3 annotation -->
  <text x="756" y="497" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1E40AF">第 3 步 · 进度分段 / 传送带 / 剧本填空题</text>
  <text x="756" y="519" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">phase() 标进度条；channel() 像传送带边出边修；</text>
  <text x="756" y="541" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">没法提前写死的步骤放 hole&lt;Plan&gt;() 先占坑，</text>
  <text x="756" y="563" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">跑出结果后主 AI 现场补代码接着跑</text>

  <line x1="756" y1="575" x2="1134" y2="575" stroke="#DBEAFE" stroke-width="1.5"/>

  <!-- Step 4 annotation -->
  <text x="756" y="595" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#1E40AF">第 4 步 · 交付可见成果：<tspan font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#1D4ED8">artifact.markdown / file</tspan></text>
  <text x="756" y="617" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#334155">或 chart / table 发布右侧预览卡片与图表，return 汇总结论</text>

  <!-- Bottom Takeaway Banner (y=666..718, x=36..1164) -->
  <rect x="36" y="666" width="1128" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="600" y="697" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14">
    <tspan fill="#FBBF24" font-weight="700">口诀：</tspan><tspan fill="#F8FAFC" font-weight="500">interface 当必填验收表，agent().ask() 是派人「填数据」，hole() 是看清现场再「补代码」，普通 if/for/Promise.all 串起来！</tspan>
  </text>
</svg>
