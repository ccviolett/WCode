  <text x="390" y="125" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#92400E">① 头部说明书注释块 <tspan font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#B45309">/* wcode-workflow ... */</tspan></text>
  <rect x="942" y="108" width="206" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="1045" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#B45309">左：YAML 抬头 · 右：大白话</text>

  <!-- Top Left: YAML Code Block (x=388..796, y=135..286) -->
  <rect x="388" y="135" width="408" height="151" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
  <text x="402" y="159" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#FBBF24">/* wcode-workflow</text>
  <text x="402" y="181" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#38BDF8">description:</tspan> 并行审查改动并汇总建议</text>
  <text x="402" y="203" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#38BDF8">whenToUse:</tspan> 提交前全面检查修改时</text>
  <text x="402" y="225" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#38BDF8">args:</tspan> { <tspan fill="#7DD3FC">base:</tspan> { <tspan fill="#C4B5FD">type:</tspan> string, <tspan fill="#6EE7B7">default:</tspan> HEAD },</text>
  <text x="450" y="247" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#7DD3FC">maxFiles:</tspan> { <tspan fill="#C4B5FD">type:</tspan> number, <tspan fill="#6EE7B7">default:</tspan> 20 } }</text>
  <text x="402" y="269" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#FBBF24">*/</text>

  <!-- Top Right: Plain-Chinese Callout Card (x=810..1148, y=135..286) -->
  <rect x="810" y="135" width="338" height="151" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="826" y="167" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#B45309">大白话批注（为什么写这段？）</text>
  <text x="826" y="190" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">1. 让 Web「工作流」页自动生成填参表单</text>
  <text x="826" y="213" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">2. 启动前自动校验参数类型（不合即拦）</text>
  <text x="826" y="236" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">3. 用 /* ... */ 块注释包裹，完全不影响</text>
  <text x="842" y="259" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#1E293B">TS 语法高亮（.dwf.ts 仍是合法 TS）！</text>

  <!-- Bottom Block: ② 编排正文（普通异步 TS 代码的 4 步常见套路）(y=308..650) -->
  <rect x="372" y="308" width="792" height="342" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="390" y="331" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">② 编排正文（普通异步 TS 代码的 4 步常见套路）</text>
  <rect x="942" y="314" width="206" height="24" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="1045" y="331" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1D4ED8">无需 import · 顶层直接 await</text>

  <!-- Bottom Left: Continuous TS Source Block (x=388..728, y=342..637) -->
  <rect x="388" y="342" width="340" height="295" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>

  <!-- Subtle step stripes inside code block -->
  <rect x="392" y="349" width="4" height="46" rx="2" fill="#38BDF8"/>
  <rect x="392" y="407" width="4" height="65" rx="2" fill="#34D399"/>
  <rect x="392" y="484" width="4" height="84" rx="2" fill="#FBBF24"/>
  <rect x="392" y="581" width="4" height="47" rx="2" fill="#A78BFA"/>

  <!-- Code dividers matching right card dividers -->
  <line x1="398" y1="401" x2="718" y2="401" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="398" y1="477" x2="718" y2="477" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="398" y1="575" x2="718" y2="575" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Step 1 code -->
  <text x="404" y="367" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">const</tspan> xs = <tspan fill="#C4B5FD">await</tspan> git.<tspan fill="#38BDF8">changedFiles</tspan>();</text>
  <text x="404" y="389" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">await</tspan> world.<tspan fill="#38BDF8">run</tspan>(<tspan fill="#6EE7B7">"pnpm"</tspan>, [<tspan fill="#6EE7B7">"typecheck"</tspan>]);</text>

  <!-- Step 2 code -->
  <text x="404" y="421" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">const</tspan> w = <tspan fill="#34D399">agent</tspan>(<tspan fill="#6EE7B7">"审查员"</tspan>, <tspan fill="#6EE7B7">"角色设定"</tspan>);</text>
  <text x="404" y="443" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">const</tspan> r = <tspan fill="#C4B5FD">await</tspan> Promise.<tspan fill="#38BDF8">all</tspan>(xs.<tspan fill="#38BDF8">map</tspan>(x =&gt;</text>
  <text x="418" y="465" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0">w.<tspan fill="#34D399">ask</tspan>&lt;<tspan fill="#FDE68A">ReviewResult</tspan>&gt;(<tspan fill="#6EE7B7">"任务"</tspan>)));</text>

  <!-- Step 3 code -->
  <text x="404" y="502" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#FBBF24">phase</tspan>(<tspan fill="#6EE7B7">"阶段名"</tspan>);</text>
  <text x="404" y="526" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">const</tspan> ch = <tspan fill="#FBBF24">channel</tspan>&lt;<tspan fill="#FDE68A">Item</tspan>&gt;();</text>
  <text x="404" y="550" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">const</tspan> p = <tspan fill="#C4B5FD">await</tspan> <tspan fill="#FBBF24">hole</tspan>&lt;<tspan fill="#FDE68A">Plan</tspan>&gt;(<tspan fill="#6EE7B7">"留白"</tspan>);</text>

  <!-- Step 4 code -->
  <text x="404" y="595" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">await</tspan> artifact.<tspan fill="#A78BFA">markdown</tspan>(<tspan fill="#6EE7B7">"report"</tspan>, md);</text>
  <text x="404" y="617" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E2E8F0"><tspan fill="#C4B5FD">return</tspan> { summary: <tspan fill="#6EE7B7">"完成"</tspan>, items: r };</text>

  <!-- Connector cues across gutter x=728..740 -->
  <line x1="728" y1="374" x2="739" y2="374" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="728" y1="440" x2="739" y2="440" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
