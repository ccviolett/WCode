<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Solid light card canvas -->
  <rect x="0" y="0" width="1200" height="740" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header (y=20..82) -->
  <text x="36" y="45" font-size="24" font-weight="700" fill="#0F172A">4. 核心机制大白话图解：为什么需要它们？跑起来什么效果？</text>
  <text x="36" y="72" font-size="14" font-weight="400" fill="#475569">把最容易绕晕的 4 组概念拆开看：解决什么痛点 → 怎么运作 → 带来什么实际效果</text>
  <line x1="36" y1="86" x2="1164" y2="86" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ==================== CARD 1 (Top-Left x=36, y=98, w=552, h=296) ==================== -->
  <rect x="36" y="98" width="552" height="296" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <path d="M 37 109 Q 37 99 47 99 L 577 99 Q 587 99 587 109 L 587 140 L 37 140 Z" fill="#FEF3C7"/>
  <line x1="36" y1="140" x2="588" y2="140" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="52" y="125" font-size="15.5" font-weight="700" fill="#92400E">① 剧本填空题 <tspan class="mono" fill="#B45309">hole&lt;T&gt;()</tspan>（动态留白：先占坑再补代码）</text>

  <!-- Pain point box -->
  <rect x="52" y="148" width="520" height="58" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="66" y="170" font-size="13.5" fill="#1E293B"><tspan font-weight="700" fill="#B45309">痛点（为什么留白）：</tspan>没查清现场前，根本不知道第 2 步要派几个人、</text>
  <text x="66" y="193" font-size="13.5" fill="#1E293B">改哪几个模块、跑什么测试，没法提前把后面代码写死！</text>

  <!-- Nested light flow strip (4-step mini flow) -->
  <rect x="52" y="214" width="520" height="90" rx="8" fill="#FFFDF5" stroke="#FCD34D" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="62" y="227" width="110" height="64" rx="7" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="117" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">第 1 步</text>
  <text x="117" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="#1E293B">查出根因</text>

  <line x1="173" y1="259" x2="185" y2="259" stroke="#D97706" stroke-width="2"/>
  <polygon points="184,254 192,259 184,264" fill="#D97706"/>

  <!-- Step 2 -->
  <rect x="192" y="227" width="110" height="64" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="247" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">到 <tspan class="mono">hole</tspan></text>
  <text x="247" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="#78350F">仅本分支暂停</text>

  <line x1="303" y1="259" x2="315" y2="259" stroke="#D97706" stroke-width="2"/>
  <polygon points="314,254 322,259 314,264" fill="#D97706"/>

  <!-- Step 3 -->
  <rect x="322" y="227" width="110" height="64" rx="7" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="377" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">主 AI 看数据</text>
  <text x="377" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="#1E293B">补入新代码</text>

  <line x1="433" y1="259" x2="445" y2="259" stroke="#D97706" stroke-width="2"/>
  <polygon points="444,254 452,259 444,264" fill="#D97706"/>

  <!-- Step 4 -->
  <rect x="452" y="227" width="110" height="64" rx="7" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.5"/>
  <text x="507" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#15803D">原地接续跑完</text>
  <text x="507" y="275" text-anchor="middle" font-size="13" font-weight="500" fill="#1E293B">拼成完整剧本</text>

  <!-- Golden comparison card -->
  <rect x="52" y="312" width="520" height="70" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="52" y="312" width="6" height="70" rx="3" fill="#EA580C"/>
  <text x="68" y="337" font-size="13.5" fill="#1E293B"><tspan font-weight="700" fill="#9A3412">黄金区分：</tspan><tspan class="mono" font-weight="700" fill="#1D4ED8">ask()</tspan> = 步骤已定，派子员工去「填数据」</text>
  <text x="122" y="363" font-size="13.5" fill="#1E293B"><tspan font-weight="700" fill="#EA580C">｜ </tspan><tspan class="mono" font-weight="700" fill="#C2410C">hole()</tspan> = 步骤未定，等看清结果让主 AI「补代码」</text>

  <!-- ==================== CARD 2 (Top-Right x=612, y=98, w=552, h=296) ==================== -->
  <rect x="612" y="98" width="552" height="296" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <path d="M 613 109 Q 613 99 623 99 L 1153 99 Q 1163 99 1163 109 L 1163 140 L 613 140 Z" fill="#DBEAFE"/>
  <line x1="612" y1="140" x2="1164" y2="140" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="628" y="125" font-size="15.5" font-weight="700" fill="#1E3A8A">② 多人分头干 <tspan class="mono" fill="#1D4ED8">Promise.all</tspan> vs 工厂传送带 <tspan class="mono" fill="#0369A1">channel()</tspan></text>

  <!-- Sub-card A: Promise.all -->
  <rect x="628" y="148" width="520" height="112" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="642" y="170" font-size="14" font-weight="700" fill="#1D4ED8">多人分头干（<tspan class="mono">Promise.all</tspan>：同时做不串记忆）</text>

  <rect x="642" y="182" width="94" height="30" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="689" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">1 个大任务</text>

  <line x1="737" y1="197" x2="749" y2="197" stroke="#2563EB" stroke-width="1.8"/>
  <polygon points="748,192 756,197 748,202" fill="#2563EB"/>

  <rect x="757" y="182" width="66" height="30" rx="6" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="790" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">独立房1</text>

  <rect x="829" y="182" width="66" height="30" rx="6" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="862" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">独立房2</text>

  <text x="907" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#64748B">···</text>

  <rect x="919" y="182" width="72" height="30" rx="6" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="955" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">独立房20</text>

  <line x1="992" y1="197" x2="1004" y2="197" stroke="#2563EB" stroke-width="1.8"/>
  <polygon points="1003,192 1011,197 1003,202" fill="#2563EB"/>

  <rect x="1012" y="182" width="122" height="30" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="1073" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">等全员齐交卷</text>

  <text x="642" y="241" font-size="13" fill="#1E293B"><tspan font-weight="700" fill="#1D4ED8">效果：</tspan>速度翻十几倍，每人只看自己那份文件不串味（等齐交卷进下关）</text>

  <!-- Sub-card B: channel() -->
  <rect x="628" y="270" width="520" height="112" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
  <text x="642" y="292" font-size="14" font-weight="700" fill="#0369A1">工厂传送带（<tspan class="mono">channel()</tspan>：边查边修不干等）</text>

  <rect x="642" y="304" width="144" height="30" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="714" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#0C4A6E">上游查出 1 个问题</text>

  <line x1="787" y1="319" x2="801" y2="319" stroke="#0284C7" stroke-width="1.8"/>
  <polygon points="800,314 808,319 800,324" fill="#0284C7"/>

  <rect x="809" y="304" width="154" height="30" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="886" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#0369A1"><tspan class="mono">channel</tspan> 传送带</text>

  <line x1="964" y1="319" x2="978" y2="319" stroke="#0284C7" stroke-width="1.8"/>
  <polygon points="977,314 985,319 977,324" fill="#0284C7"/>

  <rect x="986" y="304" width="148" height="30" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="1060" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#15803D">下游秒接手开修</text>

  <text x="642" y="363" font-size="13" fill="#1E293B"><tspan font-weight="700" fill="#0369A1">效果：</tspan>不等 20 人全查完！发现 1 个立刻送上传送带，下游 0 窝工</text>

  <!-- ==================== CARD 3 (Bottom-Left x=36, y=420, w=552, h=296) ==================== -->
  <rect x="36" y="420" width="552" height="296" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <path d="M 37 431 Q 37 421 47 421 L 577 421 Q 587 421 587 431 L 587 462 L 37 462 Z" fill="#DCFCE7"/>
  <line x1="36" y1="462" x2="588" y2="462" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="52" y="447" font-size="15.5" font-weight="700" fill="#14532D">③ 必填电子表 <tspan class="mono" fill="#15803D">ask&lt;接口&gt;()</tspan> + 真命令安检门 <tspan class="mono" fill="#15803D">world.run</tspan></text>

  <!-- Sub-card A: ask<interface>() -->
  <rect x="52" y="470" width="520" height="114" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="66" y="492" font-size="14" font-weight="700" fill="#166534">必填电子表 <tspan class="mono">ask&lt;接口&gt;()</tspan>（防 AI 乱回格式）</text>

  <rect x="66" y="502" width="154" height="30" rx="6" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.2"/>
  <text x="143" y="522" text-anchor="middle" font-size="13" font-weight="600" fill="#166534"><tspan class="mono">interface</tspan> 定字段类型</text>

  <line x1="221" y1="517" x2="233" y2="517" stroke="#16A34A" stroke-width="1.8"/>
  <polygon points="232,512 240,517 232,522" fill="#16A34A"/>

  <rect x="241" y="502" width="164" height="30" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="323" y="522" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">错格自动打回(≤3次)</text>

  <line x1="406" y1="517" x2="418" y2="517" stroke="#16A34A" stroke-width="1.8"/>
  <polygon points="417,512 425,517 417,522" fill="#16A34A"/>

  <rect x="426" y="502" width="132" height="30" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="492" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">稳拿干净 JSON</text>

  <text x="66" y="553" font-size="13" fill="#1E293B">用 <tspan class="mono" font-weight="600" fill="#15803D">interface</tspan> 规定字段和类型；子员工漏填或错格时，引擎后台</text>
  <text x="66" y="575" font-size="13" fill="#1E293B">自动打回重填（最多 3 次），脚本稳拿干净 JSON。</text>

  <!-- Sub-card B: world.run -->
  <rect x="52" y="592" width="520" height="114" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
  <text x="66" y="614" font-size="14" font-weight="700" fill="#166534">真命令安检门 <tspan class="mono">world.run</tspan>（防 AI 嘴硬假修好）</text>

  <rect x="66" y="624" width="122" height="30" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="127" y="644" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">AI 改完代码</text>

  <line x1="189" y1="639" x2="201" y2="639" stroke="#16A34A" stroke-width="1.8"/>
  <polygon points="200,634 208,639 200,644" fill="#16A34A"/>

  <rect x="209" y="624" width="176" height="30" rx="6" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.2"/>
  <text x="297" y="644" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">脚本亲跑 <tspan class="mono">pnpm test</tspan></text>

  <line x1="386" y1="639" x2="398" y2="639" stroke="#16A34A" stroke-width="1.8"/>
  <polygon points="397,634 405,639 397,644" fill="#16A34A"/>

  <rect x="406" y="624" width="152" height="30" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="482" y="644" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">报错重修→绿灯放行</text>

  <text x="66" y="675" font-size="13" fill="#1E293B">不信 AI 嘴上说改好了，脚本亲自跑 <tspan class="mono" font-weight="600" fill="#15803D">pnpm test</tspan> 拿退出码；</text>
  <text x="66" y="697" font-size="13" fill="#1E293B">报错就甩回循环重修，直到绿灯放行（命令写死且弹窗公示）。</text>

  <!-- ==================== CARD 4 (Bottom-Right x=612, y=420, w=552, h=296) ==================== -->
  <rect x="612" y="420" width="552" height="296" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 613 431 Q 613 421 623 421 L 1153 421 Q 1163 421 1163 431 L 1163 462 L 613 462 Z" fill="#E0E7FF"/>
  <line x1="612" y1="462" x2="1164" y2="462" stroke="#818CF8" stroke-width="1.5"/>
  <text x="628" y="447" font-size="15.5" font-weight="700" fill="#312E81">④ 内部请示单 <tspan class="mono" fill="#4338CA">escalate</tspan> + 两种省钱续跑（<tspan class="mono" fill="#4338CA">Resume</tspan> vs <tspan class="mono" fill="#4338CA">Amend</tspan>）</text>

  <!-- Top Box: escalate -->
  <rect x="628" y="470" width="520" height="94" rx="8" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="642" y="492" font-size="14" font-weight="700" fill="#3730A3">内部请示单 <tspan class="mono">escalate</tspan>（收缴子员工弹窗权，防止 20 窗轰炸人）</text>

  <rect x="642" y="502" width="144" height="28" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/>
  <text x="714" y="521" text-anchor="middle" font-size="13" font-weight="600" fill="#312E81">20 个子员工遇盲区</text>

  <line x1="787" y1="516" x2="799" y2="516" stroke="#4F46E5" stroke-width="1.8"/>
  <polygon points="798,511 806,516 798,521" fill="#4F46E5"/>

  <rect x="807" y="502" width="136" height="28" rx="6" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="875" y="521" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">统一递单给主 AI</text>

  <line x1="944" y1="516" x2="956" y2="516" stroke="#4F46E5" stroke-width="1.8"/>
  <polygon points="955,511 963,516 955,521" fill="#4F46E5"/>

  <rect x="964" y="502" width="170" height="28" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="1049" y="521" text-anchor="middle" font-size="13" font-weight="700" fill="#15803D">批复或汇总问你 1 次</text>

  <text x="642" y="553" font-size="13" fill="#1E293B"><tspan font-weight="700" fill="#4338CA">效果：</tspan>能主 AI 批复的直接放行，必须问你时也只汇总弹出一次，绝不连环轰炸</text>

  <!-- Bottom-Left Box: Resume -->
  <rect x="628" y="572" width="254" height="134" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="642" y="594" font-size="13.5" font-weight="700" fill="#1D4ED8"><tspan class="mono">Resume</tspan>（剧本没改接着跑）</text>
  <rect x="642" y="604" width="226" height="26" rx="5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="755" y="622" text-anchor="middle" font-size="13" font-weight="600" fill="#1E40AF">已完步骤读存档 0 秒跳过</text>
  <text x="642" y="651" font-size="13" fill="#1E293B">断网 / 重启 / 额度用尽</text>
  <text x="642" y="673" font-size="13" fill="#1E293B">（重置 +1 分钟自动醒）后，</text>
  <text x="642" y="695" font-size="13" fill="#1E293B">已完步骤 0 秒跳过，不重扣费！</text>

  <!-- Bottom-Right Box: Amend -->
  <rect x="894" y="572" width="254" height="134" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="908" y="594" font-size="13.5" font-weight="700" fill="#6D28D9"><tspan class="mono">Amend</tspan>（改了剧本借旧成果）</text>
  <rect x="908" y="604" width="226" height="26" rx="5" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="1021" y="622" text-anchor="middle" font-size="13" font-weight="600" fill="#5B21B6">前 8 步具名复用 · 第 9 步新跑</text>
  <text x="908" y="651" font-size="13" fill="#1E293B">前 8 步跑完改第 9 步代码，</text>
  <text x="908" y="673" font-size="13" fill="#1E293B">起过固定名字的子员工</text>
  <text x="908" y="695" font-size="13" fill="#1E293B">直接复用旧结果，不推倒重跑！</text>
</svg>
